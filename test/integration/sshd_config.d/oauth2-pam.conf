# Force every login through PAM keyboard-interactive, which is the only channel
# the device-flow prompt can travel over. Public keys and passwords are off so a
# test cannot accidentally authenticate by another route.
UsePAM yes
KbdInteractiveAuthentication yes
PasswordAuthentication no
PubkeyAuthentication no
PermitRootLogin no

# The module logs to authpriv; sshd's own view of the exchange is useful when a
# case fails.
LogLevel DEBUG2
