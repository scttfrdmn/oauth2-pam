name: Security

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory can land against a dependency this repo has not touched in
  # months, so the scans cannot only run on pushes.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CodeQL is the only tool here that reasons across function boundaries, which
  # is what this codebase needs: the v0.1.x bypass was a two-step data flow —
  # Success: true set in pkg/auth/broker.go, read and trusted in the C bridge.
  #
  # Both halves of that flow are analysed, which took until issue #38 to be true.
  # `languages: go` runs only the Go extractor, so cgo_bridge_linux.c — the file
  # that reads the socket, parses the broker's JSON and decides whether a login
  # happens — was in no CodeQL database at all. What blocked it was the build: the
  # C was compiled by cgo as a side effect of `go build -buildmode=c-shared`, and
  # there is no command autobuild can guess for that. Issue #65 replaced it with a
  # plain `cc -shared` line in the Makefile, and a plain compiler invocation is
  # exactly what the C extractor can trace. So the job is a matrix now, one
  # language per run, each with the build its extractor needs.
  #
  # This does not retire test/cbridge: CodeQL finds the bugs a query has been
  # written for, and the mutation check is what proves the suite guarding the grant
  # decision can still fail. They cover different things.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: c-cpp
            # manual, not autobuild: autobuild would go looking for a build system
            # and find the Makefile, whose default target also builds three Go
            # binaries the C extractor has no interest in. The one command that
            # compiles the module is named below.
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      # The module's own dependencies. Without them the compile below fails on a
      # missing security/pam_appl.h, which — because the build is `manual` — fails
      # the job rather than quietly producing an empty database.
      - name: Install PAM and json-c headers
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # Traced by the extractor, so this has to be the real compile line and not a
      # convenience copy of it: `make build-pam` is what CI and release.yml run,
      # -Werror -Wconversion and the hardening flags included. VERSION is passed
      # rather than left to git describe so the stamp cannot fail the build here.
      - name: Build the PAM module for the C extractor
        if: matrix.language == 'c-cpp'
        run: make build-pam VERSION=codeql GIT_COMMIT=codeql BUILD_DATE=codeql

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          # One SARIF upload per language against the same commit, so each needs a
          # category of its own or the second overwrites the first.
          category: "/language:${{ matrix.language }}"

  # Relevant surface here: file modes on the enrollment store and audit log, the
  # exec.Command in the tier-2 mapper, and the AES-GCM usage in pkg/security.
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install PAM and json-c headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev

      # continue-on-error on purpose: gosec is a linter with opinions, and a
      # false positive should not block a merge while its finding still lands in
      # the Security tab for triage. The gates that must stay hard are in ci.yml.
      - name: Run gosec
        continue-on-error: true
        # setup-go v6+ exports GOTOOLCHAIN=local, which is what we want for
        # building and testing this project — it must not silently compile with a
        # toolchain nobody chose. But gosec is built with a newer Go than go.mod
        # targets, so installing it needs the default resolution back.
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -fmt sarif -out gosec.sarif -exclude-dir=test ./...

      # Only if gosec got far enough to write one. Without this guard a gosec
      # crash fails the job on a missing file, defeating the continue-on-error
      # above — the step's own failure is still visible in the run.
      - name: Upload results
        if: hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gosec.sarif
          category: gosec

  # Reachability-based, so it reports the subset of advisories that touch code
  # this project actually calls rather than everything in go.sum.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This go is only used to install govulncheck and to resolve the module
      # graph; the toolchain the scan actually analyzes with is chosen in the run
      # step below, and for the reason explained there it is not this one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install PAM and json-c headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev

      # Most of what govulncheck reports against this project is not in its code
      # or its dependencies — it is the standard library of the toolchain the scan
      # ran under, every finding "fixed in" a Go patch that is already out. And
      # setup-go cannot install that patch: it installs from actions/go-versions,
      # a manifest that trails a Go release by days to weeks (at the time of
      # writing, go1.25.13 was published and the manifest's newest 1.25.x was
      # 1.25.12, which is five reachable stdlib advisories). check-latest above
      # does not help, because the manifest is what it re-reads.
      #
      # So the scan resolves the newest patch of the major go.mod pins and hands
      # it to GOTOOLCHAIN, which fetches toolchains from the module proxy — that
      # is current the moment a release lands. What remains gated is what this
      # repository can actually act on: an advisory still reachable under the
      # newest patch of the pinned major, which means the code, a dependency, or
      # the major itself has to move.
      #
      # If the major goes end-of-life it drops out of go.dev/dl (only the two
      # newest are listed), `jq -e` fails on the empty result, and the job stops
      # with it. That is the intended behaviour: a toolchain nobody patches any
      # more is the finding.
      - name: Run govulncheck
        # GOTOOLCHAIN=auto for the install, for the reason given on gosec:
        # setup-go v6+ exports local, which blocks installing a tool built with a
        # newer Go than go.mod targets.
        env:
          GOTOOLCHAIN: auto
        run: |
          # cut, because the go directive is written either way — `go 1.25` or
          # `go 1.25.0`, and `go get` rewrites one into the other. Only the major
          # belongs in the prefix match below.
          major=$(awk '/^go [0-9]/ { print $2; exit }' go.mod | cut -d. -f1,2)
          toolchain=$(curl -fsSL 'https://go.dev/dl/?mode=json' \
            | jq -er --arg prefix "go${major}." \
                '[.[] | select(.stable) | .version | select(startswith($prefix))] | first')

          # The one value here that comes off the network, and it is about to be
          # handed to the toolchain resolver. Insist on the exact shape of a Go
          # release version before using it, so a changed feed or a response from
          # something that is not go.dev fails this step rather than making
          # GOTOOLCHAIN mean something nobody intended.
          if ! printf '%s' "$toolchain" | grep -qE '^go[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::go.dev returned '$toolchain', which is not a goX.Y.Z version"
            exit 1
          fi

          echo "go.mod pins go${major}; scanning with ${toolchain}"
          # Pinned, like gosec and golangci-lint: @latest is a moving target
          # fetched into a job that then reports on this repository's security, and
          # every uses: in this file is pinned to a SHA for the same reason.
          # dependabot does not read `go install` lines, so this one moves by hand.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOTOOLCHAIN="$toolchain" govulncheck ./...

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # This project is MIT and loads a shared object into sshd's address
          # space; a copyleft dependency arriving unnoticed is a licensing
          # problem, not a style preference.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # Supply-chain posture. It will have opinions about branch protection and
  # signed releases; the pinned actions in ci.yml are already partly its doing.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    # publish_results needs a push or schedule event on the default branch; on a
    # pull_request the action fails outright rather than degrading.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: scorecard.sarif
          category: scorecard
