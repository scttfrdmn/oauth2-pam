name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow as its gate, so a tag runs exactly these jobs
  # rather than a copy of them that can drift. A tag is the one push where nothing
  # rechecks the result afterwards.
  workflow_call:

permissions:
  contents: read

# Actions are pinned to full commit SHAs with the version in a trailing comment.
# A tag is a mutable ref: whoever controls the action's repository can move it to
# any commit, and that commit then runs here with the checkout and the cache. The
# comment is what keeps the pin readable, and it is what dependabot rewrites when
# it bumps one — see .github/dependabot.yml.
#
# Take the SHA from the tags list or from `git rev-parse <tag>^{commit}`, not from
# `/git/ref/tags/<tag>`: for an annotated tag the latter returns the tag object's
# own SHA. Actions resolves that too, so it works and looks like a pin, but it
# names a wrapper around the commit rather than the commit — opaque to review, and
# a level of indirection nothing else in the ecosystem expects. security.yml had
# four of them until 2026-08-13.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Linux job is the real one: it is the only place the PAM module compiles,
  # and the only place SO_PEERCRED (peercred_linux.go, the per-UID rate limiter)
  # is more than dead code.
  linux:
    name: Linux — build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-latest: go.mod names a major (`go 1.25`), and the default is to build
      # with whatever 1.25.x the runner image already cached, which trails the
      # current release. This gets the newest patch setup-go can offer, so a
      # standard-library fix reaches these jobs — and release.yml — without
      # waiting for the runner image to be rebuilt. It stays inside the major
      # go.mod pins; it will not move to 1.26.
      #
      # It only trails less, it does not track: setup-go installs from the
      # actions/go-versions manifest, which itself lags a Go release. Where that
      # gap is load-bearing — govulncheck — the toolchain is chosen differently;
      # see security.yml.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Install PAM and json-c headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg ./internal ./test)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      # The Go tests cannot reach the bridge: it is C. This compiles it with
      # -Werror -Wconversion and exercises the boundaries the container harness
      # cannot provoke — a reply exactly the size of the buffer, a broker that
      # accepts and then goes silent, a broker that hangs up mid-request.
      #
      # Under sudo because one case binds a socket in /run/oauth2-pam, which is
      # the only directory validate_socket_path accepts. A skipped case is a
      # failure unless CBRIDGE_ALLOW_SKIP is set, so this cannot quietly degrade
      # into "ran everything except the check that needed privileges".
      # NATIVE=1 keeps it out of Docker — the headers are installed above.
      - name: C bridge tests
        run: sudo env NATIVE=1 test/cbridge/run.sh

      # And the check on that check: reintroduce each of the six fixed defects in
      # a copy of the source and assert the suite fails. Without this, SECURITY.md
      # claiming the tests are mutation-verified is a claim about a run nobody can
      # see. Same sudo/NATIVE reasoning as above — the mutated suite has to be
      # able to fail for the right reason, not skip the privileged case.
      - name: C bridge mutation check
        run: sudo env NATIVE=1 test/cbridge/mutations.sh

      # `make build` verifies with nm that all six pam_sm_* entry points made it
      # into the .so. v0.1.1 shipped a module with none, and nothing failed.
      - name: Build all binaries and verify PAM entry points
        run: make build

  # Proves the module's cgo is quarantined: cmd/pam-module/main.go must stay
  # buildable off Linux, or the project cannot be developed on a Mac.
  macos:
    name: macOS — build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: Install PAM and json-c headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpam0g-dev libjson-c-dev
      # Installed directly rather than via golangci-lint-action, whose v6 line
      # predates golangci-lint v2 and drives it with removed flags. The version
      # is pinned so a new release cannot turn a green branch red by adding
      # linters; see .golangci.yml.
      #
      # GOTOOLCHAIN=auto only for the install: setup-go v6+ exports
      # GOTOOLCHAIN=local, which is right for building and testing this project
      # (no silent toolchain substitution) but blocks installing a tool built with
      # a newer Go than go.mod targets. golangci-lint still analyzes the code with
      # the go.mod toolchain.
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - run: golangci-lint run ./...

  # The only job that exercises oauth2_pam.so in a real PAM stack: real sshd,
  # real broker, real Unix socket, with GitHub faked. Go tests cannot reach this
  # half of the protocol, and it is where the v0.1.x auth bypass would resurface.
  integration:
    name: Container harness — real sshd + PAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The driver dumps both sides' logs itself when a case fails, then tears
      # the stack down — so there is nothing left for a follow-up log step to
      # collect.
      - name: Run the harness
        run: make test-integration

  # The check on that check. SECURITY.md claims the harness would catch the v0.1.x
  # bypass; this is what makes that a statement about a run rather than a belief.
  # A separate job so a failure here is unambiguous, and so it does not share a
  # runner (and therefore the harness image tags) with the job above.
  integration-mutations:
    name: Container harness — catches the v0.1.x bypass
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reintroduce the bypass and require the harness to refuse the login
        run: make test-integration-mutations
