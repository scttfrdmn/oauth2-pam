# oauth2-pam broker configuration
# Copy to /etc/oauth2-pam/broker.yaml and edit for your environment.

server:
  socket_path: /var/run/oauth2-pam/broker.sock
  # debug | info | warn | error. Anything else is a startup error. The broker's
  # --log-level flag overrides this when it is given, so a debugging run does not
  # need this file edited; with no flag, this is what applies.
  log_level: info

  # Deadlines applied to each IPC connection. Raise read_timeout if a slow
  # identity-mapping service makes the PAM module's calls time out.
  read_timeout: 30s
  write_timeout: 30s

# ---------------------------------------------------------------------------
# OAuth2 Providers
# ---------------------------------------------------------------------------
# type selects the implementation; "github" (which also covers GitHub Enterprise
# Server, via github.base_url) is the only one shipped today. An unsupported type
# is rejected at startup with the list of supported ones.
#
# name is yours, and is what the audit log records, what the client secret's
# environment variable is derived from, and what a PAM request may name to pick
# this provider. Configure several by listing several entries; the first is the
# default for a request that does not name one.

providers:
  - name: github
    type: github
    client_id: "Iv1.xxxxxxxxxxxx"          # GitHub OAuth App client ID

    # The client secret can come from three places. Highest precedence first:
    #
    #   1. $OAUTH2_PAM_CLIENT_SECRET_GITHUB — the variable is named after the
    #      provider (uppercased, anything but A-Z0-9 becomes "_"), so a second
    #      provider named github-enterprise reads
    #      $OAUTH2_PAM_CLIENT_SECRET_GITHUB_ENTERPRISE. Set but empty is an
    #      error, not a fallback.
    #
    #   2. client_secret_file — an absolute path to a file containing the
    #      secret and nothing else, or a bare systemd credential name. This is
    #      the recommended form under systemd: add
    #
    #        LoadCredential=github-client-secret:/etc/oauth2-pam/github.secret
    #
    #      to the unit (see configs/systemd/oauth2-pam-broker.service) and then
    #      write only the credential's name here:
    #
    #        client_secret_file: github-client-secret
    #
    #      systemd stages it at 0400 in a tmpfs only this unit can see, and the
    #      config stops naming the secret's location at all.
    #
    #   3. client_secret, inline below. Supported, but it makes this file a
    #      secret-bearing file: the broker then requires broker.yaml to have no
    #      group or other permission bits (chmod 600) and to be owned by root,
    #      and refuses to start otherwise. A secret in a world-readable config
    #      is a secret every local user on the host already has.
    #
    # Whichever file holds the secret, the same rule applies to it: mode 0600,
    # owned by root. Set exactly one of client_secret and client_secret_file.
    client_secret: "your-client-secret"     # GitHub OAuth App client secret
    # client_secret_file: github-client-secret

    github:
      # Require membership in this GitHub org (leave empty to allow any GitHub user)
      require_org: my-org

      # Require membership in at least one of these teams (optional)
      # Format: "org-name/team-slug"
      # require_teams:
      #   - my-org/engineers
      #   - my-org/ops

      # Explicit user allowlist — bypasses org/team checks (optional).
      # On its own it is still a restriction: with no require_org/require_teams,
      # a login that is not listed here is refused.
      # allow_users:
      #   - octocat

      # GitHub Enterprise Server instead of github.com (optional). The device,
      # token, and API endpoints are derived from it, with the REST API under
      # /api/v3. Must be HTTPS — the client secret and the access token both
      # travel to this host.
      # base_url: https://github.acme.internal

# ---------------------------------------------------------------------------
# Identity Mapper
# ---------------------------------------------------------------------------
# Four tiers are tried in order; the first match wins.
# At least one tier must be configured.
#
# Tier 0 — enrollment_file: self-enrolled users (set up with oauth2-pam-enroll)
# Tier 1 — rules: built-in YAML rules, zero runtime dependencies
# Tier 2 — external_script: external binary (JSON stdin → JSON stdout)
# Tier 3 — http_endpoint: HTTPS identity service (POST JSON)

mapper:

  # --- Which local accounts may be mapped to at all ---
  #
  # These apply to every tier. Nothing below can produce a mapping that gets past
  # them, including an external script or HTTP service you wrote yourself.
  #
  # min_uid is the lowest UID an identity may be mapped to. 1000 is UID_MIN on
  # every mainstream distribution, so the default keeps identities off every
  # system and service account the host has. Lower it if you have real human
  # accounts below 1000 — by naming the lowest UID you mean to allow. A negative
  # value, which used to turn the floor off entirely, is rejected at startup.
  #
  # UID 0 is refused unconditionally — not by name, by UID, and neither of these
  # settings can permit it. A device flow has no cryptographic binding to the SSH
  # connection it is authorising, which makes it the weakest way to reach the most
  # privilege. OpenSSH's own default (PermitRootLogin prohibit-password) already
  # rules this out. Use an ordinary account and sudo.
  #
  # min_uid: 1000
  #
  # Alongside the floor there is a built-in denylist of system accounts (root,
  # www-data, postgres, nobody, systemd-*, anything starting with _, and so on).
  # It exists because the floor needs the account to resolve, and a broker built
  # without cgo sees only /etc/passwd — so on an LDAP/SSSD host the floor cannot
  # be applied and the denylist is what is left. If your site has a real person
  # whose account collides with a name on that list, exempt it by name; they still
  # have to satisfy min_uid, and root can never be exempted.
  #
  # allow_system_users: [mail]

  # --- Tier 0: enrollment file (optional) ---
  # Users self-enroll once with: sudo oauth2-pam-enroll --user <local-user>
  # The enrollment file maps local Unix usernames to their provider logins.
  # On auth, the broker checks whether the PAM-supplied username matches an
  # enrolled identity before falling through to the other tiers.
  #
  # Each record carries the provider it was enrolled against, so on a host with
  # two providers an account named "alice" at the other one cannot claim the
  # enrollment. Records written before v0.3.0 name no provider and match any;
  # re-enroll (--remove, then enroll) to scope them.
  #
  enrollment_enabled: false
  enrollment_file: /etc/oauth2-pam/enrolled-users.yaml

  # --- Tier 1: built-in rules ---
  # All match fields within a rule are ANDed, and matching is case-insensitive;
  # the first matching rule wins. local_user supports the {{ .Login }},
  # {{ .Email }}, and {{ .Name }} templates, and must expand to a valid POSIX
  # username — which has to be the same name the user is logging in as.
  #
  # Match keys:
  #
  #   github_login / github_org / github_team
  #       The GitHub spelling. Still supported, unchanged.
  #
  #   login
  #       The identity's username at the provider, whatever it calls it.
  #       Same thing as github_login; takes precedence if both are set.
  #
  #   claims: {<name>: <value>}
  #       Matches the provider's membership assertions by name. GitHub asserts
  #       "org" and "team" (so `claims: {org: my-org}` is exactly
  #       `github_org: my-org`); a provider asserting flat groups asserts
  #       "group". Every named claim must match, along with the other keys.
  #
  #       - match:
  #           claims:
  #             group: platform-team
  #         local_user: platformuser

  # Read this before copying the rules below.
  #
  # `local_user: "{{ .Login }}"` gated only on org membership means "whatever this
  # person calls themselves at the provider is the local account they get". That is
  # convenient and it is how most sites will want to start, but understand what it
  # delegates: whoever can create or rename an account in my-org chooses local
  # usernames on this host. On a GitHub Enterprise Server that may be a wider group
  # than you think. min_uid and the system-account denylist above are what stop the
  # obvious abuse of it (a member who renames themselves "postgres"), not the rule.
  #
  # Tighten it by listing accounts explicitly (github_login → local_user), by
  # requiring a team rather than an org, or by enrolling users (Tier 0) so that the
  # pairing is recorded on this host instead of inferred from a name.

  rules:
    # All org members get an account named after their login.
    - match:
        github_org: my-org
      local_user: "{{ .Login }}"

    # Direct user mapping (overrides any org check)
    # - match:
    #     github_login: octocat
    #   local_user: octocat

  # `groups:` is parsed, reported, and sent to the PAM module, which discards it —
  # this module authenticates, it does not manage group membership, and nothing
  # here calls setgroups(2). A rule saying `groups: [sudo]` grants no sudo. Manage
  # privilege with the host's own groups (or your configuration management), not
  # here. The shipped example deliberately no longer includes a `sudo` line, so
  # that the day groups do get applied nobody is surprised by one.
  #
  # The broker logs a warning at startup naming any groups a rule declares, so
  # this is not silently ignored, and the container harness asserts on every run
  # that a real ssh session does not carry them.
  # See https://github.com/scttfrdmn/oauth2-pam/issues/39

  # --- Tier 2: external script (optional) ---
  # The script receives an Identity JSON object on stdin and must write
  # a {"local_user": "...", "groups": [...]} JSON object to stdout.
  # Exit non-zero or emit empty/missing local_user to skip to next tier.
  #
  # This one runs as root on every login that reaches it, so the broker checks it
  # at startup and refuses to start unless it is an absolute path (not a bare name
  # found on PATH) to a regular, executable file that only root can replace —
  # no group or other write bit, on the file or on the directory holding it.
  #
  # external_script: /usr/local/lib/oauth2-pam/map-user.sh
  # external_script_timeout: 5s

  # --- Tier 3: HTTP service (optional) ---
  # POST body: {"provider":"github","login":"...","orgs":[...],"teams":[...]}
  # Expected response: {"local_user":"...","groups":[...]}
  # Return 404 or 204 to indicate no mapping (falls through to next tier).
  #
  # The endpoint must be HTTPS — a plain http:// URL is rejected at startup —
  # and redirects are refused outright to avoid an SSRF vector into your network.
  #
  # http_endpoint: https://identity.internal.example/map
  # http_timeout: 2s

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------

authentication:
  token_lifetime: 8h
  refresh_threshold: 1h
  max_concurrent_sessions: 10

  # How long the broker keeps a device flow alive waiting for approval, and how
  # long it keeps a goroutine polling the provider for it.
  #
  # Set this longer than the PAM module's timeout= argument (default 90s) or
  # logins fail before the user has run out of time. Do not set it to the
  # provider's device-code lifetime: github.com issues 15-minute codes, so an
  # abandoned SSH attempt would hold a pending slot — one of only
  # max_concurrent_auths — for a quarter of an hour. Empty or 0 means "use the
  # provider's expiry", i.e. exactly that behaviour.
  device_flow_timeout: 3m

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

security:
  secure_token_storage: true
  # Generate the key; do not invent one. 32 typeable characters hold a
  # passphrase's worth of entropy in a 256-bit slot.
  #
  #   oauth2-pam-admin gen-key
  #
  # That prints a base64-encoded 32 bytes (44 characters), which is the preferred
  # form. 16, 24, or 32 raw characters are still accepted for compatibility.
  # Rotating the key invalidates the tokens held in the broker's memory, so the
  # users holding them must authenticate again; nothing on disk is affected.
  # token_encryption_key: "paste the output of gen-key here"

  # Upper bound on how long a stored token may live. Must be >= token_lifetime
  # above; the broker refuses to start otherwise.
  max_token_age: 24h

  rate_limiting:
    # Sliding window on authenticate requests, per calling UID. The UID comes from
    # the socket's peer credentials (SO_PEERCRED on Linux, LOCAL_PEERCRED on
    # macOS/FreeBSD); the broker logs peer_credentials=false at startup if it
    # cannot get them, in which case every caller shares one window.
    #
    # Read this as a host-wide backstop, not a per-attacker limit: every PAM
    # caller is sshd running as root, so in practice every request lands in the
    # same bucket. Sizing it tightly does not slow an attacker down, it denies
    # logins — at the old default of 60 a burst of ssh connections could refuse
    # interactive login host-wide. sshd's MaxStartups is the control that bounds
    # concurrent pre-auth connections; max_concurrent_auths below bounds the work
    # each one can create.
    #
    # Polls of an in-progress login are counted per session, not here, and are
    # capped separately at 120/minute — twice what the lowest permitted
    # poll_interval needs.
    max_requests_per_minute: 300
    # Ceiling on device flows awaiting approval broker-wide; each one holds a
    # goroutine polling the provider. Further authenticate requests are refused
    # with RATE_LIMITED until one finishes or hits device_flow_timeout. Size it
    # for peak concurrent logins: a refusal is a failed login, and one abandoned
    # flow holds a slot for device_flow_timeout.
    max_concurrent_auths: 50

# ---------------------------------------------------------------------------
# Audit logging
# ---------------------------------------------------------------------------

audit:
  enabled: true

  # There is no format key. Records are JSON, always: the old one was parsed,
  # defaulted to json, and read by nothing, so `format: text` was accepted and
  # ignored. It is now rejected instead.
  #
  # type is one of file, stdout or syslog. An unrecognised one is a startup
  # error: it used to fall back to stdout, so `type: fille` gave a broker that
  # started cleanly and wrote its audit trail somewhere nobody was watching.
  # There is no webhook sink — url and headers were parsed and ignored, and are
  # now rejected.
  outputs:
    - type: file
      path: /var/log/oauth2-pam/audit.log

    # Uncomment to also log to stdout (useful for journald / Docker)
    # - type: stdout

    # Uncomment to log to the local syslog daemon. facility is one of auth,
    # authpriv, daemon, user or local0-local7; severity is one of emerg, alert,
    # crit, err, warning, notice, info or debug. Both are optional and default
    # to auth.info, which is where sshd's own accept and reject lines go — the
    # audit trail can then be read against them in one pass.
    #
    # A syslog daemon may truncate a long line (1024 bytes is common), so keep
    # the file sink as well where records must be complete.
    # - type: syslog
    #   facility: auth
    #   severity: info

  # Only these event types are written; everything else is dropped and counted.
  # Omit the list entirely to record every event. An unrecognised name here is
  # a startup error rather than a silent hole in the audit trail, so this list
  # must be a subset of:
  #
  #   authentication_attempt   a login attempt began (a device flow started)
  #   authentication_success   a login was authorized
  #   authentication_failed    the attempt failed (provider or broker error)
  #   authentication_denied    the attempt was refused (denial, org/team, or
  #                            a mapped user that is not the login name)
  #   device_flow_failed       the device flow itself could not be started
  #   session_revoked          a session was revoked
  #
  events:
    - authentication_attempt
    - authentication_success
    - authentication_failed
    - authentication_denied
    - device_flow_failed
    - session_revoked
